server:
  port: ${PORT:8080}

spring:
  application:
    name: moeda-estudantil-backend
  
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  
  jackson:
    serialization:
      fail-on-empty-beans: false
    default-property-inclusion: non_null

logging:
  level:
    com.moedaestudantil: DEBUG

security:
  bcrypt:
    strength: 8

    